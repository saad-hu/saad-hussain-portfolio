<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded background -->
  <rect width="32" height="32" rx="6" ry="6" fill="url(#bgGradient)" stroke="#333333" stroke-width="0.5"/>
  
  <!-- Code bracket decorations -->
  <path d="M6 10 L4 12 L6 14" stroke="#00ff88" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M26 10 L28 12 L26 14" stroke="#00ff88" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Main initials -->
  <text x="16" y="21" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="url(#textGradient)">SH</text>
  
  <!-- Small decorative dots representing code -->
  <circle cx="8" cy="24" r="1" fill="#00ff88" opacity="0.6"/>
  <circle cx="24" cy="24" r="1" fill="#00ff88" opacity="0.6"/>
  <circle cx="16" cy="27" r="0.8" fill="#ffffff" opacity="0.4"/>
</svg>